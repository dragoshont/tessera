# Tessera — config + grants, mounted at /config.
#
# ── WHAT YOU CHANGE ──────────────────────────────────────────────────────────
# • identity.oidc on the DEPLOYMENT env (issuer/audience) — see deployment.yaml.
# • grants/bindings/recipes below — your callers, your people, your providers.
# Everything here is non-secret. Credential VALUES live in your store (Key Vault),
# never in this file — bindings only reference the store secret *name*.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tessera-config
  namespace: default
  labels:
    app: tessera
data:
  tessera.json: |
    {
      "server": { "host": "0.0.0.0", "port": 8080 },
      "serverIdentity": { "id": "", "displayName": "Tessera Home", "apiVersion": "v1", "protocolVersion": 1 },
      "identity": {
        "mode": "oidc",
        "trustDomain": "tessera.local",
        "oidc": { "issuer": "", "audience": "", "tenantId": "" }
      },
      "policy": { "default": "deny", "document": "/config/grants.json" },
      "audit": { "enabled": true, "path": "-" },
      "egress": { "enabled": false, "allowedHosts": [] },
      "modelGateways": {
        "enabled": true,
        "allowPlainHttp": true,
        "endpoints": [
          {
            "id": "homelab",
            "displayName": "Homelab LiteLLM",
            "endpoint": "http://litellm.default.svc.cluster.local:4000/v1",
            "autoConnect": true,
            "defaultModel": "claude-haiku-4.5",
            "defaultContextLimit": 200000,
            "credentialEnvironmentVariable": "TESSERA_LITELLM_MASTER_KEY"
          }
        ]
      },
      "reginaMaria": {
        "enabled": true,
        "allowPlainHttp": true,
        "actionCredentialRef": "regina-maria-tessera-action-token",
        "connectors": [
          { "id": "account-a", "displayName": "My Regina Maria", "endpoint": "http://reginamaria-mcp.default.svc.cluster.local:8080/mcp" },
          { "id": "account-b", "displayName": "Wife - Regina Maria", "endpoint": "http://reginamaria-mcp-manuela.default.svc.cluster.local:8080/mcp" }
        ]
      },
      "gmailOAuth": {
        "enabled": false,
        "clientId": "",
        "clientSecretRef": "google-oauth-client-secret",
        "redirectUri": "https://tessera.example/oauth/gmail/callback",
        "scopes": [
          "https://www.googleapis.com/auth/gmail.readonly",
          "https://www.googleapis.com/auth/gmail.compose"
        ]
      }
    }

  grants.json: |
    {
      "grants": [
        {
          "caller": "chat://your-chat",
          "onBehalfOf": "alice@example.com",
          "target": "health-portal",
          "actions": ["read:*"]
        },
        {
          "caller": "app-nightly-crawler",
          "target": "marketplace",
          "actions": ["read:listings"]
        }
      ],
      "bindings": [
        {
          "target": "health-portal",
          "onBehalfOf": "alice@example.com",
          "credential": "health-portal-alice-session"
        },
        {
          "target": "marketplace",
          "credential": "marketplace-crawler-session"
        }
      ],
      "recipes": [
        {
          "target": "health-portal",
          "driver": "browser",
          "egress": "none",
          "actions": ["read:results"],
          "description": "patient portal (read-only)"
        }
      ]
    }
